name = "halo-music"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

[vars]
# Username allowlist for the read-only /admin dashboard.
ADMIN_USERNAME = "admin"
# Keep this value in sync with package.json for deployments.
HALO_MUSIC_VERSION = "2.0.18"
# Verified Resend sender for Halo Music. RESEND_API_KEY is a secret and must be
# set with `wrangler pages secret put RESEND_API_KEY`.
RESEND_FROM = "no-reply@music.zhoujun.dev"
RESEND_SENDER_NAME = "HALO Music"
# Music source configuration. The "QQ Music" entry in the UI is backed by
# JOOX now, so only the Netease and JOOX endpoints are used.
# Values here are deployment configuration, not hardcoded in Functions.
NETEASE_SOURCE_URLS = "https://music.duanjinglin.com/api,https://met.liiiu.cn/meting/api"
JOOX_API_URL = "https://apicx.asia/api/joox_music"
JOOX_TOKEN = "f84ao9lMF_q7husBWRfgUw"

# Registration secrets. Do not commit real values: put them in .dev.vars for
# local development and in the Pages dashboard (or `wrangler pages secret put`)
# for production.
#   RESEND_API_KEY        Resend API key used by POST /api/email-code
#   RESEND_FROM           Optional; defaults to no-reply@music.zhoujun.dev
#   RESEND_SENDER_NAME    Optional display name when RESEND_FROM is a bare address
#   GOOGLE_CLIENT_ID      Google OAuth 2.0 client ID
#   GOOGLE_CLIENT_SECRET  Google OAuth 2.0 client secret
#   GOOGLE_REDIRECT_URI   Optional; defaults to <origin>/api/auth/google/callback
#   AUTH_SECRET           Optional pepper mixed into stored registration IP hashes
#   CACHE_REFRESH_TOKEN   Bearer token for POST /api/cache-refresh

[[d1_databases]]
binding = "DB"
database_name = "halo-music-db"
database_id = "019a9fe9-3a0a-4362-82e7-22e38b72943a"
