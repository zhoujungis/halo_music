name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: plan
        name: Plan next version
        shell: bash
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          else
            NEXT="$CURRENT"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
      - id: release
        name: Bump version, commit and tag
        shell: bash
        run: |
          NEXT="${{ steps.plan.outputs.next }}"
          node scripts/bump-version.mjs "$NEXT"
          node scripts/build-html.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add package.json package-lock.json wrangler.toml index.html android/app/build.gradle
            git commit -m "chore(release): v$NEXT [skip ci]"
            git push origin HEAD:main
          fi
          SHA="$(git rev-parse HEAD)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NEXT"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git tag -fa "v$NEXT" -m "HALO Music $NEXT" "$SHA"
          git push origin "refs/tags/v$NEXT" --force

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Windows installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.msi
            release/*.yml
            release/*.blockmap

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          HALO_VERSION: ${{ needs.prepare.outputs.version }}
          HALO_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          gradle -p android assembleDebug --no-daemon \
            -PhaloVersionName="$HALO_VERSION" \
            -PhaloVersionCode="$HALO_VERSION_CODE"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/HALO-Music-${HALO_VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/HALO-Music.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: artifacts/*.apk

  release:
    needs: [prepare, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List release assets
        run: ls -lh artifacts
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '184aee957761f720ea0b9b737bdb68be' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured; skipping Pages deploy."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy . --project-name halo-music --branch main
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: HALO Music ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.apk
            artifacts/*.yml
            artifacts/*.blockmap
