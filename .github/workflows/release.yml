name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: plan
        name: Plan next version
        shell: bash
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          else
            NEXT="$CURRENT"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
      - id: release
        name: Bump version, commit and tag
        shell: bash
        run: |
          NEXT="${{ steps.plan.outputs.next }}"
          node scripts/bump-version.mjs "$NEXT"
          node scripts/build-html.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add package.json package-lock.json wrangler.toml index.html android/app/build.gradle
            git commit -m "chore(release): v$NEXT [skip ci]"
            git push origin HEAD:main
          fi
          SHA="$(git rev-parse HEAD)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NEXT"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git tag -fa "v$NEXT" -m "HALO Music $NEXT" "$SHA"
          git push origin "refs/tags/v$NEXT" --force

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The test job only runs node --test; skip Electron's ~100MB binary so a
      # cache miss (the release bump changes package-lock) can't stall CI.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  windows:
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Windows installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.msi
            release/*.yml
            release/*.blockmap

  android:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          HALO_VERSION: ${{ needs.prepare.outputs.version }}
          HALO_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          gradle -p android assembleDebug --no-daemon \
            -PhaloVersionName="$HALO_VERSION" \
            -PhaloVersionCode="$HALO_VERSION_CODE"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/HALO-Music-${HALO_VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/HALO-Music.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: artifacts/*.apk

  release:
    needs: [prepare, test, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # 先部署再下载安装包：artifacts 里的 exe 超过 Pages 25MiB 单文件上限，
      # 必须在干净的工作区里上传。
      - name: Ensure D1 columns (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '184aee957761f720ea0b9b737bdb68be' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured; skipping D1 column migration."
            exit 0
          fi
          npx --yes wrangler@4 d1 execute halo-music-db --remote --command "ALTER TABLE music_play_history ADD COLUMN source TEXT NOT NULL DEFAULT ''" || true
          npx --yes wrangler@4 d1 execute halo-music-db --remote --command "ALTER TABLE music_play_history ADD COLUMN cover TEXT NOT NULL DEFAULT ''" || true
          npx --yes wrangler@4 d1 execute halo-music-db --remote --command "ALTER TABLE music_play_history ADD COLUMN duration INTEGER NOT NULL DEFAULT 0" || true
          npx --yes wrangler@4 d1 execute halo-music-db --remote --command "ALTER TABLE music_play_history ADD COLUMN album TEXT NOT NULL DEFAULT ''" || true
          npx --yes wrangler@4 d1 execute halo-music-db --remote --command "CREATE TABLE IF NOT EXISTS toplist_cache (chart TEXT PRIMARY KEY, payload_json TEXT NOT NULL, updated_at INTEGER NOT NULL)" || true
          npx --yes wrangler@4 d1 execute halo-music-db --remote --command "CREATE TABLE IF NOT EXISTS shared_playlists (token TEXT PRIMARY KEY, username TEXT NOT NULL, name TEXT NOT NULL, description TEXT NOT NULL DEFAULT '', tracks_json TEXT NOT NULL, created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL)" || true
          npx --yes wrangler@4 d1 execute halo-music-db --remote --command "CREATE TABLE IF NOT EXISTS music_links (key TEXT PRIMARY KEY, source TEXT NOT NULL, title TEXT NOT NULL DEFAULT '', artist TEXT NOT NULL DEFAULT '', album TEXT NOT NULL DEFAULT '', cover TEXT NOT NULL DEFAULT '', quality TEXT NOT NULL DEFAULT '', url TEXT NOT NULL, lyric TEXT NOT NULL DEFAULT '', updated_at INTEGER NOT NULL)" || true
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '184aee957761f720ea0b9b737bdb68be' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured; skipping Pages deploy."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy . --project-name halo-music --branch main --commit-dirty=true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List release assets
        run: ls -lh artifacts
      - name: Generate SHA256 checksums
        run: sha256sum artifacts/*.exe artifacts/*.msi artifacts/*.apk > artifacts/SHA256SUMS.txt; cat artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: HALO Music ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.apk
            artifacts/*.yml
            artifacts/*.blockmap
            artifacts/SHA256SUMS.txt
      # 国内镜像：每次覆盖 latest 发行版，只放 exe 与 apk（Gitee 单附件 100MB，
      # MSI 102MB 传不上去；固定 latest 也避免仓库附件总量撞 1GB 上限）。
      - name: Remove previous Gitee release
        if: ${{ vars.GITEE_OWNER != '' && vars.GITEE_REPO != '' }}
        continue-on-error: true
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: delete_release
          gitee_owner: ${{ vars.GITEE_OWNER }}
          gitee_repo: ${{ vars.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: latest
      - name: Publish Gitee mirror
        if: ${{ vars.GITEE_OWNER != '' && vars.GITEE_REPO != '' }}
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: ${{ vars.GITEE_OWNER }}
          gitee_repo: ${{ vars.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: latest
          gitee_release_name: HALO Music 最新版
          gitee_release_body: 国内直连下载（GitHub 需要梯子）。只提供 Windows 安装包和安卓 APK。
          gitee_target_commitish: main
          gitee_upload_retry_times: 3
          gitee_files: |
            artifacts/HALO-Music-Setup-x64.exe
            artifacts/HALO-Music.apk
