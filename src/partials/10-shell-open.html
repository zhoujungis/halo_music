        <div class="brand-mark ripple-target">
          <img src="favicon.svg?v={{ASSET_V}}" alt="HALO Music" class="brand-mark-img">
        </div>
        <div class="title-text">
          <h1 data-i18n="appTitle">Halo音乐</h1>
        </div>
      </div>
      <div class="header-controls">
        <nav class="desktop-nav" aria-label="主导航">
          <button type="button" data-desktop-view="search">发现</button>
          <button type="button" data-desktop-view="toplist">榜单</button>
          <button type="button" data-desktop-view="lyrics" aria-current="page">正在播放</button>
          <button type="button" data-desktop-view="queue">播放队列</button>

        <button id="client-download-nav-button" class="client-download-nav-button ripple-target" type="button" aria-label="下载客户端" title="下载客户端"><span aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3v10"/><path d="m7 9 5 5 5-5"/><path d="M5 18v2h14v-2"/></svg></span><b>下载客户端</b></button>
        <div class="nav-links">
        </div>

      </div>
    </header>
