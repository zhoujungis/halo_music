      <!-- 右：播放列表 -->
      <section class="panel playlist-panel ripple-target">
        <div class="panel-header">
          <button id="mobile-playlist-back" class="mobile-playlist-back" type="button" title="返回歌单" aria-label="返回歌单">←</button>
          <button id="mobile-playlist-delete" class="mobile-playlist-delete" type="button" title="删除歌单" aria-label="删除歌单">×</button>
          <div class="playlist-tabs ripple-target">
            <div class="playlist-tab active" data-tab="results" data-i18n="tabResults">正在播放</div>
            <div class="playlist-tab" data-tab="sleep">睡眠</div>
            <div class="playlist-tab" data-tab="offline">离线</div>
            <div class="playlist-tab" data-tab="favorites" data-i18n="tabFavorites">收藏</div>
            <div class="playlist-tab" data-tab="playlists" data-i18n="tabCustomLists">歌单</div>
            <div class="playlist-tab" data-tab="profile">我的信息</div>
          </div>
        </div>

        <div class="playlist-main">
          <div class="playlist-bar">
            <div class="playlist-top-row">
              <div class="playmode-row">
                <button class="playmode-btn active ripple-target" data-mode="list" title="顺序播放" aria-label="顺序播放">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
                </button>
                <button class="playmode-btn ripple-target" data-mode="single" title="单曲循环" aria-label="单曲循环">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/><path d="M11 10h2v5"/></svg>
                </button>
                <button class="playmode-btn ripple-target" data-mode="shuffle" title="随机播放" aria-label="随机播放">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                </button>
                <button id="clear-playlist-btn" class="btn btn-ghost clear-playlist-btn ripple-target" type="button" data-i18n="queueClear" data-i18n-title="queueClear" title="清空播放列表" aria-label="清空播放列表">清空</button>
              </div>
            </div>
            <div id="playlist-select-row" class="playlist-select-row" style="display:none;">
              <div class="playlist-file-actions">
                <button id="delete-playlist-btn" class="btn btn-ghost ripple-target" data-i18n="deletePlaylist">删除歌单</button>
                <button id="edit-playlist-btn" class="btn btn-ghost ripple-target">编辑歌单</button>
                <button id="share-playlist-btn" class="btn btn-ghost ripple-target" type="button">分享歌单</button>
                <button id="new-playlist-btn" class="btn btn-ghost ripple-target" data-i18n="newPlaylist">新建歌单</button>
                <button id="import-playlist-btn" class="btn btn-ghost ripple-target" data-i18n="importPlaylist" title="支持网易云音乐、汽水音乐和 QQ 音乐分享链接">导入歌单</button>
                <button id="export-playlist-btn" class="btn btn-ghost ripple-target" data-i18n="exportPlaylist">导出歌单</button>
                <input id="import-playlist-input" type="file" accept="application/json,text/plain,.json,.txt" style="display:none;" />
              </div>
            </div>
          </div>
          <div id="playlist-list" class="playlist-list"></div>

          <div id="playlist-sleep-view" class="playlist-tab-view sleep-view" hidden>
            <div class="sleep-card">
              <div id="sleep-timer-status-wrap" class="sleep-hero">
                <span class="sleep-icon" aria-hidden="true">☾</span>
                <div class="sleep-copy">
                  <span class="sleep-heading">睡眠定时</span>
                  <span id="sleep-timer-status" class="sleep-countdown">未开启</span>
                  <span id="sleep-timer-end" class="sleep-end" hidden></span>
                </div>
                <button id="sleep-timer-cancel" class="sleep-cancel-btn" type="button" title="关闭定时" aria-label="关闭定时" hidden>取消</button>
              </div>
              <div class="sleep-options">
                <div id="sleep-timer-options" class="sleep-presets" role="group" aria-label="睡眠定时器">
                  <button class="sleep-timer-option" data-minutes="10" type="button"><b>10</b><span>分钟</span></button>
                  <button class="sleep-timer-option" data-minutes="15" type="button"><b>15</b><span>分钟</span></button>
                  <button class="sleep-timer-option" data-minutes="30" type="button"><b>30</b><span>分钟</span></button>
                  <button class="sleep-timer-option" data-minutes="45" type="button"><b>45</b><span>分钟</span></button>
                  <button class="sleep-timer-option" data-minutes="60" type="button"><b>60</b><span>分钟</span></button>
                  <button class="sleep-timer-option" data-custom type="button"><b>＋</b><span>自定义</span></button>
                  <button class="sleep-timer-option sleep-track-option" data-mode="track" type="button">播完当前这首</button>
                </div>
                <p class="sleep-tip">最后 5 秒音量渐弱，安静停止</p>
                <form id="sleep-custom-form" class="sleep-custom" hidden>
                  <input id="sleep-custom-minutes" type="number" min="1" max="600" step="1" inputmode="numeric" placeholder="分钟" aria-label="自定义分钟数" />
                  <button class="btn btn-secondary" type="submit">开始</button>
                </form>
              </div>
            </div>
          </div>

          <div id="playlist-offline-view" class="playlist-tab-view offline-view" hidden>
            <div class="offline-view-head">
              <p id="offline-summary" class="offline-summary">已下载 0 首</p>
              <button id="offline-import-btn" class="btn btn-secondary ripple-target" type="button">导入本地歌曲</button>
              <input id="offline-import-input" type="file" accept="audio/*" multiple style="display:none;" />
            </div>
            <div id="offline-list" class="offline-list"></div>
          </div>

          <section id="account-profile-view" class="account-profile-view" hidden aria-label="我的信息">
            <header class="account-hero">
              <div id="account-avatar-preview" class="account-avatar-preview" aria-hidden="true">H</div>
              <div class="account-hero-text">
                <h2 id="account-profile-name">我的信息</h2>
                <p id="account-profile-id"></p>
              </div>
              <button id="account-logout" class="btn btn-ghost account-hero-logout" type="button">退出登录</button>
            </header>
            <section class="listening-summary insights-panel" aria-live="polite">
              <div class="insights-head">
                <h3 class="account-section-title">听歌分析</h3>
                <button id="insights-share-card" class="btn btn-ghost insights-share-btn" type="button">生成分享卡</button>
              </div>
              <div id="listening-summary-content" class="listening-summary-content">正在加载…</div>
            </section>
            <div class="account-settings-grid">
              <form id="account-profile-form" class="account-form">
                <h3 class="account-section-title">个人资料</h3>
                <label>用户名<input id="account-display-name" type="text" minlength="2" maxlength="20" required /></label>
                <label>头像图片地址<input id="account-avatar-url" type="url" maxlength="1000" placeholder="https://…（可留空）" /></label>
                <button id="account-profile-save" class="btn btn-secondary" type="submit">保存资料</button>
              </form>
              <form id="account-password-form" class="account-form account-password-form">
                <h3 class="account-section-title">修改密码</h3>
                <label>当前密码<input id="account-current-password" type="password" autocomplete="current-password" required /></label>
                <label>新密码<input id="account-new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required /></label>
                <button class="btn btn-ghost" type="submit">更新密码</button>
              </form>
            </div>
            <section class="account-session-actions">
              <div class="account-language-row">
                <span>语言</span>
                <button class="btn btn-ghost" type="button" data-lang-toggle>EN</button>
              </div>
              <details class="account-delete-details">
                <summary>注销账户</summary>
                <p>注销后账号、收藏、歌单和听歌记录都会删除，无法恢复。</p>
                <label>输入当前密码确认<input id="account-delete-password" type="password" autocomplete="current-password" /></label>
                <button id="account-delete" class="btn btn-danger" type="button">永久注销账户</button>
              </details>
            </section>
          </section>
        </div>
      </section>
