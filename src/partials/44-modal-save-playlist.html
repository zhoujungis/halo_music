  <!-- 保存到歌单弹窗 -->
  <div id="save-playlist-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal save-playlist-modal ripple-target">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-title-icon">＋</div>
          <span id="save-playlist-title" data-i18n="saveToPlaylistTitle">保存到歌单</span>
        </div>
        <button id="save-playlist-close" class="modal-close-btn" type="button" aria-label="关闭">×</button>
      </div>
      <p id="save-playlist-description" class="modal-desc" data-i18n="saveToPlaylistDescription">选择一张歌单保存当前歌曲</p>
      <div id="save-playlist-options" class="save-playlist-options"></div>
      <button id="save-playlist-create" class="btn btn-ghost save-playlist-create ripple-target" type="button" data-i18n="libraryCreateAction">新建</button>
    </div>
  </div>
