      <!-- 中：播放器 -->
      <section class="panel player-panel ripple-target">
        <div class="player-top">
          <div class="cover-wrapper" role="button" tabindex="0" aria-label="Play or pause">
            <img id="cover-img" src="" alt="cover" />
            <div class="cover-placeholder">
              <div class="cover-disc"></div>
            </div>
            <svg class="cover-ring-label" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <defs>
                <path id="cover-ring-path" d="M 15,50 A 35,35 0 0 1 85,50" />
              </defs>
              <text>
                <textPath href="#cover-ring-path" startOffset="50%" text-anchor="middle">HALO MUSIC</textPath>
              </text>
            </svg>
          </div>
          <div class="player-main">
            <div class="track-title-row">
              <div class="track-text">
                <div id="track-title" class="track-title"></div>
                <div id="track-artist" class="track-artist"></div>
                <div class="track-tags">
                  <span id="track-source-pill" class="source-pill" style="display:none;"></span>
                  <span id="track-quality-pill" class="lossless-pill" style="display:none;">LOSSLESS</span>
                </div>
              </div>
              <div class="player-actions">
                <div class="player-btn-row">
                  <button id="fav-btn" class="btn btn-secondary btn-icon ripple-target" title="收藏 (F)">❤</button>
                  <button id="save-to-playlist-btn" class="btn btn-secondary btn-icon ripple-target" title="保存到歌单" aria-label="保存到歌单">＋</button>
                  <button id="queue-add-current-btn" class="btn btn-secondary btn-icon queue-add-btn ripple-target" type="button" title="加入播放列表" aria-label="加入播放列表">☷</button>
                  <button id="download-btn" class="btn btn-secondary btn-icon ripple-target" type="button" data-i18n-title="downloadTitle" title="下载当前歌曲" aria-label="下载当前歌曲"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M5 19h14"/></svg></button>
                  <button id="offline-btn" class="btn btn-secondary btn-icon ripple-target" type="button" title="离线歌曲" aria-label="离线歌曲"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v10H4z"/><path d="M8 19h8"/><path d="M12 15v4"/></svg></button>
                </div>
                <div id="player-status" class="status-pill" data-i18n="playerStatusIdle">空闲</div>
              </div>
            </div>

            <div class="player-controls">
              <div class="progress-row">
                <span id="current-time" class="progress-time">00:00</span>
                <div id="progress-bar-wrapper" class="progress-bar-wrapper ripple-target">
                  <div id="progress-bar" class="progress-bar"></div>
                  <div id="progress-handle" class="progress-handle"></div>
                </div>
                <span id="total-time" class="progress-time">00:00</span>
              </div>
              <div class="control-row">
                <div class="control-main">
                  <button id="prev-btn" class="btn btn-secondary btn-icon ripple-target" title="上一首 (P)">⏮</button>
                  <button id="play-btn" class="btn play-btn ripple-target" title="播放/暂停 (Space)">▶</button>
                  <button id="next-btn" class="btn btn-secondary btn-icon ripple-target" title="下一首 (N)">⏭</button>
                </div>
                <div class="control-secondary">
                  <span class="volume-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></span>
                  <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量" title="音量" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="lyrics-container">
          <div id="lyrics-inner" class="lyrics-inner"></div>
        </div>

        <audio id="audio" preload="auto" aria-hidden="true"></audio>
      </section>
