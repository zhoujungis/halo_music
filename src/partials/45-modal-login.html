  <div id="login-modal" class="modal-backdrop login-modal" aria-hidden="true">
    <div class="modal ripple-target auth-modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <div class="auth-brand-row">
        <span class="auth-brand-mark">H</span>
        <span>HALO MUSIC <i>ACCOUNT</i></span>
        <span class="auth-brand-tag">SECURE ACCESS</span>
      </div>
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-title-icon">H</div>
          <div class="auth-heading">
            <span id="login-title">登录 HALO MUSIC</span>
            <small id="login-description">登录后可同步收藏与歌单；搜索和播放无需登录</small>
          </div>
        </div>
        <button id="login-close" class="modal-close-btn" type="button" aria-label="关闭登录">×</button>
      </div>
      <div class="auth-tabs" role="tablist" aria-label="账号入口">
        <button id="auth-tab-login" class="auth-tab is-active" type="button" role="tab" aria-selected="true">登录</button>
        <button id="auth-tab-register" class="auth-tab" type="button" role="tab" aria-selected="false">注册</button>
      </div>
      <button id="google-auth-btn" class="google-auth-btn" type="button">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="google-auth-label">使用 Google 账号继续</span>
      </button>
      <div class="auth-divider"><span>或使用邮箱</span></div>
      <form id="login-form" class="login-form">
        <label class="auth-field">
          <span>用户名</span>
          <input id="login-account-input" type="text" minlength="3" maxlength="20" autocomplete="username" placeholder="3–20 位字母、数字、下划线或中文" />
        </label>
        <label class="auth-field">
          <span>密码</span>
          <div class="auth-password-wrap">
            <input id="login-password-input" type="password" minlength="8" autocomplete="current-password" placeholder="至少 8 位密码" />
            <button class="auth-password-toggle" type="button" data-target="login-password-input" aria-label="显示密码">显示</button>
          </div>
        </label>
        <p id="login-error" class="auth-error" role="alert" hidden></p>
        <div class="login-actions"><button id="login-submit" class="btn ripple-target" type="submit">登录</button></div>
      </form>
      <form id="register-form" class="login-form" hidden>
        <label class="auth-field">
          <span>邮箱</span>
          <input id="register-email-input" type="email" inputmode="email" maxlength="254" autocomplete="email" placeholder="you@gmail.com" />
        </label>
        <label class="auth-field">
          <span>邮箱验证码</span>
          <div class="auth-code-row">
            <input id="register-code-input" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位数字" />
            <button id="register-send-code" class="btn btn-secondary auth-send-code" type="button">发送验证码</button>
          </div>
        </label>
        <div class="auth-field-row">
          <label class="auth-field">
            <span>用户名</span>
            <input id="register-username-input" type="text" minlength="3" maxlength="20" autocomplete="username" placeholder="3–20 位字符" />
          </label>
          <label class="auth-field">
            <span>设置密码</span>
            <div class="auth-password-wrap">
              <input id="register-password-input" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="至少 8 位" />
              <button class="auth-password-toggle" type="button" data-target="register-password-input" aria-label="显示密码">显示</button>
            </div>
          </label>
        </div>
        <p id="register-error" class="auth-error" role="alert" hidden></p>
        <div class="login-actions"><button id="register-submit" class="btn ripple-target" type="submit">创建账号</button></div>
      </form>
      <p class="login-notice">验证码由 Resend 发送，10 分钟内有效。</p>
    </div>
  </div>
