  <!-- 歌单弹窗 -->
  <div id="playlist-modal" class="modal-backdrop">
    <div class="modal ripple-target">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-title-icon">🎵</div>
          <span data-i18n="modalNewPlaylistTitle">新建歌单</span>
        </div>
        <button id="playlist-close" class="modal-close-btn">×</button>
      </div>
      <p class="modal-desc" data-i18n="modalNewPlaylistDesc">给你的歌单取一个可爱的名字吧～</p>
      <input id="playlist-name-input" type="text" placeholder="例如：通勤歌单 / 宝可梦歌单" />
      <input id="playlist-desc-input" type="text" maxlength="200" placeholder="一句话介绍这张歌单（可选）" />
      <div class="modal-actions">
        <button id="playlist-cancel-btn" class="btn btn-ghost ripple-target" data-i18n="modalCancel">取消</button>
        <button id="playlist-confirm-btn" class="btn btn-secondary ripple-target" data-i18n="modalConfirm">确定</button>
      </div>
    </div>
  </div>
